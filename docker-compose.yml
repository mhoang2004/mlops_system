x-common-env: &common-env
  CELERY_BROKER_URL:     redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  MINIO_ENDPOINT:        minio:9000
  MINIO_ACCESS_KEY:      ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY:      ${MINIO_ROOT_PASSWORD}
  API_INTERNAL_URL:      http://api:8000
  EXPERIMENT_WORKDIR:    /workspace/experiments
  MLFLOW_TRACKING_URI:   http://mlflow:5000

services:

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./common:/app/common
    environment:
      <<: *common-env
      POSTGRES_USER:         ${POSTGRES_USER}
      POSTGRES_PASSWORD:     ${POSTGRES_PASSWORD}
      POSTGRES_DB:           ${POSTGRES_DB}
      MINIO_PUBLIC_ENDPOINT: localhost:9000
    networks:
      - mlops_network
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Training Worker ───────────────────────────────────────────────────────────
  # Works on CPU by default.
  # For GPU: install NVIDIA Container Toolkit, then uncomment `runtime` below
  # and set NVIDIA_VISIBLE_DEVICES=all in your .env file.
  training-worker:
    build:
      context: ./trainingworker
      dockerfile: Dockerfile
    container_name: mlops-training-worker
    # runtime: nvidia   # ← uncomment on GPU machines (requires NVIDIA Container Toolkit)
    volumes:
      - ./trainingworker:/app
      - ./common:/app/common
      - worker_data:/workspace/experiments
    environment:
      <<: *common-env
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-void}   # void = no GPU; set to "all" for GPU
      WORKER_NAME:  ${WORKER_NAME:-local}
      WORKER_HOST:  ${WORKER_HOST:-host.docker.internal}
    networks:
      - mlops_network
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command: python /app/startup.py celery -A celery_app worker --loglevel=info --concurrency=2 -Q celery

  # ── MLflow ───────────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    environment:
      MLFLOW_ENABLE_PROXY_FIX: "true"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    networks:
      - mlops_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Database ──────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - ./local_data/postgres:/var/lib/postgresql/data
    networks:
      - mlops_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO ─────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./local_data/minio:/data
    networks:
      - mlops_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - mlops_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── node-exporter ────────────────────────────────────────────────────────────
  # CPU, RAM, Disk, Network metrics cho máy host này.
  # Scrape tại: http://localhost:9100/metrics
  # NOTE: disabled on Windows — rslave mount propagation is not supported by Docker Desktop
  # node-exporter:
  #   image: prom/node-exporter:latest
  #   container_name: mlops-node-exporter
  #   restart: unless-stopped
  #   network_mode: host
  #   pid: host
  #   volumes:
  #     - /:/host:ro,rslave
  #   command:
  #     - --path.rootfs=/host

  # ── cAdvisor ─────────────────────────────────────────────────────────────────
  # Per-container CPU và RAM metrics.
  # Scrape tại: http://localhost:8080/metrics
  # NOTE: disabled on Windows — privileged system mounts (/sys, /dev/kmsg) not supported by Docker Desktop
  # cadvisor:
  #   image: gcr.io/cadvisor/cadvisor:latest
  #   container_name: mlops-cadvisor
  #   restart: unless-stopped
  #   privileged: true
  #   devices:
  #     - /dev/kmsg
  #   volumes:
  #     - /:/rootfs:ro
  #     - /var/run:/var/run:ro
  #     - /sys:/sys:ro
  #     - /var/lib/docker/:/var/lib/docker:ro
  #     - /dev/disk/:/dev/disk:ro
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - mlops_network

  # ── DCGM Exporter ─────────────────────────────────────────────────────────────
  # GPU metrics (util, VRAM, temp, power). Chỉ dùng trên máy có GPU NVIDIA.
  # Yêu cầu: NVIDIA Container Toolkit đã được cài trên host.
  # Scrape tại: http://localhost:9400/metrics
  # Để bật: uncomment toàn bộ block này và set NVIDIA_VISIBLE_DEVICES=all trong .env
  # dcgm-exporter:
  #   image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
  #   container_name: mlops-dcgm-exporter
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   cap_add:
  #     - SYS_ADMIN
  #   ports:
  #     - "9400:9400"
  #   networks:
  #     - mlops_network

networks:
  mlops_network:
    driver: bridge

volumes:
  worker_data:
  redis_data:
  mlflow_data:
